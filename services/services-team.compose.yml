name: agentchat-services-team

services:
  backend:
    image: "${AGENTCHAT_IMAGE:-agentchat-services:local}"
    build:
      context: ..
      dockerfile: services/Dockerfile
    command: ["node", "backend-v2.js"]
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs: [/tmp]
    env_file:
      - ${AGENTCHAT_ENV_FILE:-../.env}
    environment:
      NODE_ENV: production
      AGENT_CHAT_RUNTIME_DIR: /var/lib/agent-chat
    volumes:
      - agentchat-runtime:/var/lib/agent-chat
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(`http://127.0.0.1:$${process.env.AGENT_CHAT_BACKEND_PORT || 8090}/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 15s

  dashboard:
    image: "${AGENTCHAT_IMAGE:-agentchat-services:local}"
    build:
      context: ..
      dockerfile: services/Dockerfile
    command: ["node", "server.js"]
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs: [/tmp]
    env_file:
      - ${AGENTCHAT_ENV_FILE:-../.env}
    environment:
      NODE_ENV: production
      AGENT_CHAT_RUNTIME_DIR: /var/lib/agent-chat
    volumes:
      - agentchat-runtime:/var/lib/agent-chat
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(`http://127.0.0.1:$${process.env.AGENT_CHAT_WEB_PORT || 8084}/`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 10s

  bridge:
    image: "${AGENTCHAT_IMAGE:-agentchat-services:local}"
    build:
      context: ..
      dockerfile: services/Dockerfile
    command: ["services/run-bridge-container.sh"]
    restart: unless-stopped
    network_mode: host
    pid: host
    read_only: true
    tmpfs: [/tmp]
    env_file:
      - ${AGENTCHAT_ENV_FILE:-../.env}
    environment:
      NODE_ENV: production
      AGENT_CHAT_RUNTIME_DIR: /var/lib/agent-chat
    volumes:
      - agentchat-runtime:/var/lib/agent-chat
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 15s

  relay:
    image: "${AGENTCHAT_IMAGE:-agentchat-services:local}"
    build:
      context: ..
      dockerfile: services/Dockerfile
    command: ["node", "push-relay.js"]
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs: [/tmp]
    env_file:
      - ${AGENTCHAT_ENV_FILE:-../.env}
    environment:
      NODE_ENV: production
      AGENT_CHAT_RUNTIME_DIR: /var/lib/agent-chat
      PUSH_RELAY_MODE: local
    volumes:
      - agentchat-runtime:/var/lib/agent-chat
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 10s

volumes:
  agentchat-runtime:
