name: Publish image

# Publishes the service image to GHCR on tag. Free for public repositories and
# needs no third-party registry credentials.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.2.0)'
        required: true

permissions:
  contents: read
  packages: write
  # Required for build provenance attestation.
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/agentchat-services

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve identity
        id: id
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          RELEASE="${TAG#v}"
          PKG="$(node -e 'process.stdout.write(require("./package.json").version)')"
          if [ "$RELEASE" != "$PKG" ]; then
            echo "::error::tag $TAG implies $RELEASE but package.json says $PKG"
            exit 1
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(TZ=UTC git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)" >> "$GITHUB_OUTPUT"
          # Pre-releases must not move :latest.
          case "$TAG" in
            *-*) echo "latest=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "latest=true"  >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        run: |
          set -euo pipefail
          R="${{ steps.id.outputs.release }}"
          TAGS="${IMAGE}:${R},${IMAGE}:sha-${{ steps.id.outputs.revision }}"
          if [ "${{ steps.id.outputs.latest }}" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Stamped so the image reports its own release and revision; it has
          # no .git to derive them from.
          build-args: |
            HAFLEET_RELEASE=${{ steps.id.outputs.release }}
            HAFLEET_REVISION=${{ steps.id.outputs.revision }}
            HAFLEET_BUILT_AT=${{ steps.id.outputs.built_at }}
            HAFLEET_CHANNEL=release
          labels: |
            org.opencontainers.image.title=HAFleet services
            org.opencontainers.image.version=${{ steps.id.outputs.release }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.id.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Smoke test the published image
        run: |
          set -euo pipefail
          REF="${IMAGE}:${{ steps.id.outputs.release }}"
          # The image must be self-runnable and must report the identity we
          # stamped. Previously it had no entrypoint at all.
          docker run --rm "$REF" --help | grep -q 'HAFleet service image'
          ACTUAL="$(docker run --rm "$REF" version)"
          echo "reported: $ACTUAL"
          echo "$ACTUAL" | grep -q "${{ steps.id.outputs.release }}"
          echo "$ACTUAL" | grep -q "${{ steps.id.outputs.revision }}"
